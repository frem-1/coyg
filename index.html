<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sports Streams</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #e5e7eb;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    select, input {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2933;
      color: #e5e7eb;
      font-size: 16px;
    }

    .container {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .matches {
      background: #1f2933;
      border: 1px solid #374151;
      border-radius: 12px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 10px;
    }

    .league {
      margin-bottom: 18px;
    }

    .league h3 {
      margin: 10px 0;
      font-size: 16px;
      color: #93c5fd;
      border-bottom: 1px solid #374151;
      padding-bottom: 4px;
    }

    .match {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      border: 1px solid #374151;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
    }

    .match:hover {
      background: #273244;
    }

    .live {
      background: #7f1d1d;
      color: #fecaca;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: bold;
    }

    .streams {
      background: #1f2933;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 16px;
      min-height: 300px;
    }

    button {
      background: #374151;
      color: #e5e7eb;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin: 6px 6px 6px 0;
    }

    button:hover {
      background: #4b5563;
    }

    .hint {
      color: #9ca3af;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h2>Live Sports</h2>

  <select id="sportSelect">
    <option value="football">Football</option>
    <option value="basketball">Basketball</option>
    <option value="boxing">Boxing</option>
    <option value="mma">MMA</option>
    <option value="tennis">Tennis</option>
  </select>

  <input id="searchInput" placeholder="Search matches..." />

  <div class="container">
    <div class="matches" id="matches"></div>
    <div class="streams" id="streams">
      <p class="hint">Click a match</p>
    </div>
  </div>

  <script>
    const PROXY_URL = "https://coyg.onrender.com";

    const matchesEl = document.getElementById("matches");
    const streamsEl = document.getElementById("streams");
    const sportSelect = document.getElementById("sportSelect");
    const searchInput = document.getElementById("searchInput");

    let allMatches = [];

    function getLeague(title) {
      if (title.toLowerCase().includes("premier")) return "Premier League";
      if (title.toLowerCase().includes("la liga")) return "La Liga";
      if (title.toLowerCase().includes("serie")) return "Serie A";
      if (title.toLowerCase().includes("nba")) return "NBA";
      if (title.toLowerCase().includes("ufc")) return "UFC";
      return "Other";
    }

    function isLive(title) {
      return title.toLowerCase().includes("live") || title.includes("vs");
    }

    async function loadMatches() {
      matchesEl.innerHTML = '<p class="hint">Loading matches...</p>';
      streamsEl.innerHTML = '<p class="hint">Click a match</p>';

      const res = await fetch(`${PROXY_URL}/api/matches/${sportSelect.value}`);
      allMatches = await res.json();

      renderMatches();
    }

    function renderMatches() {
      matchesEl.innerHTML = "";

      const search = searchInput.value.toLowerCase();
      const filtered = allMatches.filter(m =>
        m.title.toLowerCase().includes(search)
      );

      const leagues = {};

      filtered.forEach(match => {
        const league = getLeague(match.title);
        if (!leagues[league]) leagues[league] = [];
        leagues[league].push(match);
      });

      Object.keys(leagues).forEach(league => {
        const leagueDiv = document.createElement("div");
        leagueDiv.className = "league";

        const h3 = document.createElement("h3");
        h3.textContent = league;
        leagueDiv.appendChild(h3);

        leagues[league].forEach(match => {
          const div = document.createElement("div");
          div.className = "match";

          const title = document.createElement("span");
          title.textContent = match.title;

          div.appendChild(title);

          if (isLive(match.title)) {
            const live = document.createElement("span");
            live.className = "live";
            live.textContent = "LIVE";
            div.appendChild(live);
          }

          div.onclick = () => loadStreams(match);
          leagueDiv.appendChild(div);
        });

        matchesEl.appendChild(leagueDiv);
      });
    }

    async function loadStreams(match) {
      streamsEl.innerHTML = '<p class="hint">Loading streams...</p>';

      if (!match.sources || match.sources.length === 0) {
        streamsEl.innerHTML = '<p class="hint">No streams available</p>';
        return;
      }

      const src = match.sources[0];
      const res = await fetch(`${PROXY_URL}/api/stream/${src.source}/${src.id}`);
      const streams = await res.json();

      streamsEl.innerHTML = `<h3>${match.title}</h3>`;

      streams.forEach((s, i) => {
        const btn = document.createElement("button");
        btn.textContent = `Stream ${i + 1}`;
        btn.onclick = () => window.open(s.embedUrl, "_blank");
        streamsEl.appendChild(btn);
      });
    }

    sportSelect.addEventListener("change", loadMatches);
    searchInput.addEventListener("input", renderMatches);

    loadMatches();
  </script>
</body>
</html>
